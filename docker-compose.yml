services:
  api:
    build: .
    image: audio-extract-api
    container_name: audio-extract-api
    restart: unless-stopped
    # Only on localhost: Tailscale Serve/Funnel is what publishes it with TLS
    ports:
      - "127.0.0.1:3080:3080"
    env_file: .env
    # Set here (not in .env) so these can't be overridden by mistake: they must
    # match the paths inside the image and the mounted volume
    environment:
      PORT: 3080
      FILES_DIR: /data/files
      TMPDIR: /data/tmp
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
    volumes:
      # Uploads and generated files: ephemeral, but needs room for 1 GB uploads
      - api-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  api-data:
